<!doctype html>
<html lang="en" data-bs-theme="dark" data-lte-color-mode="off">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Change password · QA</title>
  <link rel="icon" type="image/png" href="/assets/baldaworks-logo.2f170e666ef7bcd0.png">
  <link rel="stylesheet" href="/assets/vendor/adminlte/adminlte.min.css">
  <link rel="stylesheet" href="/assets/vendor/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/assets/app.2f134ef117c5730c.css">
</head>
<body class="layout-fixed fixed-header sidebar-expand-lg bg-body-tertiary" data-refresh-path="/qa/ui/auth/session/refresh">
<a class="skip-link" href="#main-content">Skip to main content</a>
<div class="app-wrapper auth-wrapper">
  
  <div class="app-main" hx-history-elt><div id="request-error" class="alert alert-danger m-3" role="alert" tabindex="-1" hidden></div><main hx-history="false" id="main-content" class="login-page" data-bs-theme="dark" tabindex="-1">
  <section class="login-box" aria-labelledby="password-heading"><div class="card"><div class="card-body">
    <p class="eyebrow mb-2">Account security</p>
    <h1 id="password-heading" class="h3">Change password</h1><p>Enter your current password and choose a new one. This ends your previous browser sessions and opens a fresh one.</p>
    
    <form method="post" action="/qa/ui/account/password" data-mutation-form hx-post="/qa/ui/account/password" hx-target="#main-content" hx-swap="outerHTML">
      <input type="hidden" name="csrf_token" value="qa-csrf">
      <div class="mb-3"><label for="current-password" class="form-label">Current password</label><input id="current-password" name="current_password" type="password" data-write-only class="form-control" autocomplete="current-password" required></div>
      <div class="mb-3"><label for="new-password" class="form-label">New password</label><input id="new-password" name="new_password" type="password" data-write-only class="form-control" autocomplete="new-password" minlength="12" maxlength="72" required autofocus></div>
      <button class="btn btn-primary" type="submit">Change password</button>
    <span class="mutation-status" role="status" aria-live="polite" hidden>Submitting…</span></form>
    <form method="post" action="/qa/ui/logout" hx-boost="false" class="mt-3"><input type="hidden" name="csrf_token" value="qa-csrf"><button class="btn btn-link" type="submit">Sign out</button></form>
  </div></div></section>
</main></div>
  
</div>
<div class="modal" id="action-confirmation" tabindex="-1" aria-labelledby="action-confirmation-title" aria-describedby="action-confirmation-body" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable"><div class="modal-content">
    <div class="modal-header"><h2 class="modal-title fs-5" id="action-confirmation-title">Confirm action</h2><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
    <div class="modal-body text-break" id="action-confirmation-body"></div>
    <div class="modal-footer"><button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal" data-confirm-cancel autofocus>Cancel</button><button type="button" class="btn btn-danger" data-confirm-accept>Confirm</button></div>
  </div></div>
</div>
<script src="/assets/vendor/bootstrap/bootstrap.min.js"></script>
<script src="/assets/vendor/htmx/htmx.min.js"></script>
<script src="/assets/vendor/adminlte/adminlte.min.js"></script>

<script src="/assets/webauthn.40e5e004cad3b5e5.js"></script>
</body>
</html>
