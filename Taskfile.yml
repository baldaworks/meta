version: "3"

vars:
  PROJECTS_DIR: '{{.HOME}}/Projects'

includes:
  balda:
    taskfile: ./projects/balda/Taskfile.yml
    optional: true
    dir: ./projects/balda
  knowl:
    taskfile: ./projects/knowl/Taskfile.yml
    optional: true
    dir: ./projects/knowl

  acpbench:
    taskfile: ./projects/acpbench
    optional: true
    dir: ./projects/acpbench
  acpboss:
    taskfile: ./projects/acpboss
    optional: true
    dir: ./projects/acpboss
  acpchat:
    taskfile: ./projects/acpchat
    optional: true
    dir: ./projects/acpchat
  acpdump:
    taskfile: ./projects/acpdump
    optional: true
    dir: ./projects/acpdump
  acprun:
    taskfile: ./projects/acprun
    optional: true
    dir: ./projects/acprun

  mcpdump:
    taskfile: ./projects/mcpdump
    optional: true
    dir: ./projects/mcpdump

tasks:
  sync:git:
    desc: Run a Git operation in the meta repository
    cmds:
      - git {{range .CLI_ARGS_LIST}}{{shellQuote .}} {{end}}

  review:pr:
    desc: Manage a GitHub pull request (pass gh pr arguments after --)
    cmds:
      - gh pr {{range .CLI_ARGS_LIST}}{{shellQuote .}} {{end}}

  backoffice:stitch:import:
    desc: Capture the Balda QA export with Playwright and upload all routes to Stitch
    vars:
      E2E_DIR: '{{.ROOT_DIR}}/projects/balda/qa/backoffice-e2e'
    env:
      E2E_DIR: '{{.E2E_DIR}}'
    cmds:
      - test -d "$E2E_DIR/node_modules/playwright" || npm ci --prefix "$E2E_DIR" --no-audit --no-fund
      - |
        node -e 'const fs = require("node:fs"); const {chromium} = require(process.env.E2E_DIR + "/node_modules/playwright"); process.exit(fs.existsSync(chromium.executablePath()) ? 0 : 1)' || "$E2E_DIR/node_modules/.bin/playwright" install chromium
      - node .stitch/balda-backoffice/capture.cjs "$E2E_DIR"
      - task: backoffice:stitch:upload

  backoffice:stitch:upload:
    desc: Upload captured Balda QA screens and resume from saved progress
    cmds:
      - python3 .stitch/balda-backoffice/upload.py

  backoffice:preview:
    desc: Serve the pinned Balda Backoffice with synthetic QA data
    dir: projects/balda
    cmds:
      - go run ./cmd/balda backoffice qa serve --listen 127.0.0.1:8096

  apm:install:
    desc: Install workspace skills locally or for the current Codex user (GLOBAL=true)
    vars:
      GLOBAL: '{{.GLOBAL | default "false"}}'
      MANIFEST_YAML:
        sh: cat apm.yml
      MANIFEST:
        ref: fromYaml .MANIFEST_YAML
    requires:
      vars:
        - name: GLOBAL
          enum: ["true", "false"]
    cmds:
      - '{{if eq .GLOBAL "true"}}apm install --global --target codex{{range .MANIFEST.dependencies.apm}} {{shellQuote .}}{{end}}{{else}}apm install --frozen{{end}}'

  apm:lock:
    desc: Install project skills and refresh the APM lockfile after manifest changes
    cmds:
      - apm install

  sync:
    desc: Fast-forward meta main and check out its published submodule pins
    cmds:
      - git switch main
      - git fetch origin main
      - |
        if ! git merge-base --is-ancestor HEAD FETCH_HEAD; then
          echo "Local main has unpublished commits. Run task sync:status to inspect the workspace." >&2
          exit 1
        fi
      - git merge --ff-only FETCH_HEAD
      - task: sync:pins

  sync:pins:
    desc: Initialize and check out the submodule revisions recorded by meta
    cmds:
      - git submodule sync --recursive
      - git submodule update --init --recursive
      - git submodule status --recursive

  sync:sibling:fetch:
    desc: Fetch a standalone project and show its current branch status
    requires:
      vars:
        - name: PROJECT
          enum: &projects [acpbench, acpboss, acpchat, acpdump, acprun, balda, boyan, callee, codex-acp, go-actorlayer, hostplugin, knowl, mcpdump, prism, prism-callee, promptkitty]
    env:
      SIBLING_DIR: '{{.PROJECTS_DIR}}/{{.PROJECT}}'
    cmds:
      - git -C "$SIBLING_DIR" fetch origin
      - git -C "$SIBLING_DIR" status --short --branch

  sync:sibling:
    desc: Fetch and fast-forward a standalone project's main branch
    requires:
      vars:
        - name: PROJECT
          enum: *projects
    env:
      SIBLING_DIR: '{{.PROJECTS_DIR}}/{{.PROJECT}}'
    cmds:
      - task: sync:sibling:fetch
        vars:
          PROJECT: '{{.PROJECT}}'
      - git -C "$SIBLING_DIR" switch main
      - git -C "$SIBLING_DIR" merge --ff-only origin/main

  sync:status:
    desc: Show local changes, project pins and meta main's divergence from origin
    cmds:
      - git status --short --branch
      - git submodule status --recursive
      - git submodule foreach --recursive 'git status --short --branch'
      - git log --oneline --left-right main...origin/main

  sync:pin:update:
    desc: Prepare and display a pin update to the published project main
    cmds:
      - task: prepare-pin
        vars: {PROJECT: '{{.PROJECT}}', ACTION: update}

  sync:pin:rollback:
    desc: Prepare and display the previous pin for one project
    cmds:
      - task: prepare-pin
        vars: {PROJECT: '{{.PROJECT}}', ACTION: rollback}

  prepare-pin:
    internal: true
    requires:
      vars:
        - name: PROJECT
          enum: *projects
    env:
      PIN_PATH: 'projects/{{.PROJECT}}'
      PIN_ACTION: '{{.ACTION}}'
    preconditions:
      - sh: test -z "$(git status --porcelain --ignore-submodules=none -- "$PIN_PATH")"
        msg: The project has local changes. Inspect them with task sync:status.
    cmds:
      - git submodule update --init -- "$PIN_PATH"
      - |
        set -eu
        if [ "$PIN_ACTION" = update ]; then
          git -C "$PIN_PATH" fetch origin main
          revision=$(git -C "$PIN_PATH" rev-parse FETCH_HEAD)
        else
          change=$(git log -1 --first-parent --format=%H HEAD -- "$PIN_PATH")
          revision=$(git rev-parse --verify "$change^:$PIN_PATH") || {
            echo "No previous pin exists at $PIN_PATH." >&2
            exit 1
          }
        fi
        git -C "$PIN_PATH" switch --detach "$revision"
        git diff --submodule=log -- "$PIN_PATH"

  sync:pin:record:
    desc: Commit the reviewed project pin in meta
    requires:
      vars:
        - name: PROJECT
          enum: *projects
    env:
      PIN_PATH: 'projects/{{.PROJECT}}'
    preconditions:
      - sh: test -e "$PIN_PATH/.git" && test -z "$(git -C "$PIN_PATH" status --porcelain)"
        msg: Initialize the project and preserve any local edits before recording its pin.
    cmds:
      - |
        set -eu
        if git diff --quiet HEAD -- "$PIN_PATH"; then
          echo "Pin already recorded."
        else
          git commit --only -m "chore: update ${PIN_PATH#projects/} pin" -- "$PIN_PATH"
        fi

  sync:publish:
    desc: Push the current meta branch to origin
    cmds:
      - git push origin HEAD

  sync:project:add:
    desc: Register a workspace project as a Git submodule
    requires:
      vars:
        - name: PROJECT
          enum: *projects
    env:
      PROJECT_NAME: '{{.PROJECT}}'
    cmds:
      - git submodule add --name "$PROJECT_NAME" "https://github.com/baldaworks/$PROJECT_NAME.git" "projects/$PROJECT_NAME"

  worktree:add:
    desc: Create a project worktree from fresh main or the meta pin
    requires: &worktree_inputs
      vars:
        - name: PROJECT
          enum: *projects
        - WORK
    env: &worktree_env
      WT_PROJECTS_DIR: '{{.PROJECTS_DIR}}'
      WT_PROJECT: '{{.PROJECT}}'
      WT_WORK: '{{.WORK | default ""}}'
      WT_BASE: '{{.BASE | default "main"}}'
      WT_TARGET: '{{.TARGET | default ""}}'
    cmds:
      - sh scripts/worktree.sh add

  worktree:list:
    desc: List a standalone project's registered worktrees and branches
    requires:
      vars:
        - name: PROJECT
          enum: *projects
    env: *worktree_env
    cmds:
      - sh scripts/worktree.sh list

  worktree:run:
    desc: Run a project task inside the selected worktree
    requires:
      vars:
        - name: PROJECT
          enum: *projects
        - WORK
        - TARGET
    env: *worktree_env
    cmds:
      - sh scripts/worktree.sh run

  worktree:remove:
    desc: Remove a clean project worktree and retain its branch
    requires: *worktree_inputs
    env: *worktree_env
    cmds:
      - sh scripts/worktree.sh remove

  worktree:beads:
    desc: Run Beads in a project worktree (pass bd arguments after --)
    requires: *worktree_inputs
    env: *worktree_env
    cmds:
      - sh scripts/worktree.sh beads {{range .CLI_ARGS_LIST}}{{shellQuote .}} {{end}}

  worktree:git:
    desc: Run Git in the selected project worktree (pass arguments after --)
    requires: *worktree_inputs
    env: *worktree_env
    cmds:
      - sh scripts/worktree.sh git {{range .CLI_ARGS_LIST}}{{shellQuote .}} {{end}}
